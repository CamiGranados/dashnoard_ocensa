<button
  type="button"
  class="app-sidebar-toggle"
  aria-label="Abrir navegación principal"
  aria-controls="primary-navigation"
  [attr.aria-expanded]="visible()"
  (click)="openNavigation()"
>
  <i class="pi pi-bars" aria-hidden="true"></i>
  <span>Menú</span>
</button>

<p-drawer
  id="primary-navigation"
  [visible]="visible()"
  (visibleChange)="onVisibleChange($event)"
  [modal]="mobile()"
  [dismissible]="mobile()"
  [closeOnEscape]="mobile()"
  [showCloseIcon]="mobile()"
  position="left"
  styleClass="app-sidebar"
>
  <ng-template #header>
    <div class="app-sidebar__brand">
      <span class="app-sidebar__brand-icon">
        <i class="pi pi-circle-fill"></i>
      </span>
      <span class="app-sidebar__brand-text">
        <span class="app-sidebar__brand-title">OCENSA</span>
        <span class="app-sidebar__brand-subtitle">Industrial Analytics</span>
      </span>
    </div>
  </ng-template>

  <nav aria-label="Navegación principal">
    <p-panelmenu [model]="items" [multiple]="true" class="app-sidebar__menu" />
  </nav>

  <ng-template #footer>
    <div class="app-sidebar_footer">
      <img src="images/Logo CIC.png" />
    </div>
  </ng-template>
</p-drawer>
